name: Microsoft printer reference control
on:
  push:
    paths: ['printer/reference-control/**', 'docs/printer/reference-control.md', '.github/workflows/printer-reference-control.yml']
  pull_request:
    paths: ['printer/reference-control/**', 'docs/printer/reference-control.md', '.github/workflows/printer-reference-control.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    name: ARM64 UWP cross-build on VS2022 x64
    runs-on: windows-2022
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Check pinned source and isolation rules
        shell: pwsh
        run: ./printer/reference-control/tests/Check-Source.ps1
      - name: Build pinned official sample
        shell: pwsh
        run: ./printer/reference-control/Build-Control.ps1 -OutputDirectory "$env:RUNNER_TEMP\rc"
      - name: Preserve build evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: reference-control-build-evidence
          path: |
            ${{ runner.temp }}/rc/build.log
            ${{ runner.temp }}/rc/build-evidence.json
            ${{ runner.temp }}/rc/host-evidence.json
            ${{ runner.temp }}/rc/source-comparison.json
            ${{ runner.temp }}/rc/source/original-files.json
            ${{ runner.temp }}/rc/upstream.json
            ${{ runner.temp }}/rc/Microsoft-LICENSE.txt
            ${{ runner.temp }}/rc/resources/resource-evidence.json
            ${{ runner.temp }}/rc/resources/packaged-AppxManifest.xml
          if-no-files-found: warn
      - name: Unsigned ARM64 control
        uses: actions/upload-artifact@v4
        with:
          name: microsoft-reference-control-unsigned-arm64
          path: ${{ runner.temp }}/rc/delivery/
          if-no-files-found: error
