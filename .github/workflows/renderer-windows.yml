name: Renderer Windows

on:
  pull_request:
    paths: ['renderer/**', 'docs/renderer/**', 'desktop-pdf/**', 'printer/psa/App.cpp', 'printer/package/DiagnosticPdc.xml', 'printer/BuildSupport.ps1', '.github/workflows/renderer-windows.yml']
  push:
    branches: [main]
    paths: ['renderer/**', 'docs/renderer/**', 'desktop-pdf/**', 'printer/psa/App.cpp', 'printer/package/DiagnosticPdc.xml', 'printer/BuildSupport.ps1', '.github/workflows/renderer-windows.yml']
  workflow_dispatch:
    inputs:
      scope:
        description: Explicit own-code-only gate or full integration and renderer regression
        type: choice
        options: [own-code, full]
        default: full
        required: true
      expected_sha:
        description: Approved 40-hex source commit (dispatch ref is a branch or tag)
        type: string
        required: true

permissions:
  contents: read

env:
  GIT_CONFIG_COUNT: '1'
  GIT_CONFIG_KEY_0: core.autocrlf
  GIT_CONFIG_VALUE_0: 'false'

jobs:
  integration:
    name: Own-code native ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            visualStudio: '2022'
          - arch: arm64
            runner: windows-11-arm
            visualStudio: '2026'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      EXPECTED_SHA: ${{ inputs.expected_sha }}
      EVENT_NAME: ${{ github.event_name }}
      SELECTED_SCOPE: ${{ github.event_name == 'workflow_dispatch' && inputs.scope || 'full' }}
      TARGET_ARCH: ${{ matrix.arch }}
      VISUAL_STUDIO: ${{ matrix.visualStudio }}
      EVIDENCE: ${{ github.workspace }}/desktop-pdf/out/ci-evidence-${{ matrix.arch }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Guard exact approved source and scope before execution
        id: guard
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          $head = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:SOURCE_SHA) { throw 'Checkout is not exact event/PR head.' }
          if ($env:EVENT_NAME -eq 'workflow_dispatch') {
              if ($env:EXPECTED_SHA -cnotmatch '^[0-9a-fA-F]{40}$') { throw 'Expected approved 40-hex SHA required.' }
              if ($head -cne $env:EXPECTED_SHA.ToLowerInvariant()) { throw 'Approved SHA differs; STOP without retry.' }
              if ($env:SELECTED_SCOPE -notin @('own-code', 'full')) { throw 'Invalid manual scope.' }
          } elseif ($env:SELECTED_SCOPE -cne 'full') { throw 'Automatic events must run full regressions.' }
      - name: Fetch only exact source-comparison objects
        run: |
          git fetch --no-tags --depth=1 origin 8b34e5669bec822bb82768fd61b0483bbdd74567 12cc27915d08fcf29c5b1f00c422e0a16cc23e1b
          if ($LASTEXITCODE -ne 0) { throw 'Pinned source comparison objects unavailable.' }
      - name: Check source contracts and selected commit whitespace
        id: source
        run: |
          $ErrorActionPreference = 'Stop'
          [IO.Directory]::CreateDirectory($env:EVIDENCE) | Out-Null
          $python = Get-Command python -CommandType Application -ErrorAction Stop
          if ($python.Source -match '\\WindowsApps\\') { throw 'A real preinstalled Python is required, not a Store alias.' }
          & $python.Source --version
          if ($LASTEXITCODE -ne 0) { throw 'Preinstalled Python failed.' }
          & $python.Source desktop-pdf/tests/Source.py 2>&1 | Tee-Object -FilePath "$env:EVIDENCE/source-checks.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Source/provenance checks failed.' }
          git show --format= --check HEAD
          if ($LASTEXITCODE -ne 0) { throw 'Selected commit whitespace check failed.' }
      - name: Compile all own-code targets, check native PE and run all CTests
        id: native
        run: |
          $ErrorActionPreference = 'Stop'
          Set-StrictMode -Version Latest
          [IO.Directory]::CreateDirectory($env:EVIDENCE) | Out-Null
          $actual = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString().ToLowerInvariant()
          if ($actual -cne $env:TARGET_ARCH) { throw "Native OS architecture mismatch: $actual" }
          foreach ($tool in @('cmake', 'ctest')) { Get-Command $tool -CommandType Application -ErrorAction Stop | Out-Null }
          $versionOutput = @(& cmake --version)
          if ($LASTEXITCODE -ne 0 -or $versionOutput.Count -eq 0 -or
              $versionOutput[0] -notmatch '^cmake version ([0-9]+\.[0-9]+\.[0-9]+)') { throw 'Cannot identify preinstalled CMake.' }
          $version = [version]$Matches[1]
          $minimum = if ($env:VISUAL_STUDIO -eq '2026') { [version]'4.2.0' } else { [version]'3.24.0' }
          if ($version -lt $minimum) { throw "Preinstalled CMake $minimum+ required; no installation/fallback." }
          . ./printer/BuildSupport.ps1
          $plan = Get-PrinterBuildPlan -Root (Join-Path $PWD 'desktop-pdf') -Architecture $env:TARGET_ARCH `
              -HostArchitecture $actual -VisualStudioVersion $env:VISUAL_STUDIO
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path -LiteralPath $vswhere -PathType Leaf)) { throw 'Missing preinstalled vswhere.' }
          $instances = @(& $vswhere -latest -products '*' -version $plan.VisualStudioRange `
              -requires $plan.RequiredComponent -property installationPath)
          if ($LASTEXITCODE -ne 0 -or $instances.Count -ne 1 -or -not $instances[0]) { throw 'Missing requested preinstalled v143 Visual Studio component.' }
          $sdk = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits/10/Include/10.0.26100.0/um/Windows.h'
          if (-not (Test-Path -LiteralPath $sdk -PathType Leaf)) { throw 'Preinstalled SDK 26100 required.' }
          $build = Join-Path $PWD "desktop-pdf/out/ci-$env:TARGET_ARCH"
          $log = "$env:EVIDENCE/build-and-tests.txt"
          function Checked([string]$Program, [string[]]$Arguments) {
              & $Program @Arguments 2>&1 | Tee-Object -FilePath $log -Append
              if ($LASTEXITCODE -ne 0) { throw "Stage $Program failed with exit $LASTEXITCODE; STOP without repair/retry." }
          }
          try {
              Checked cmake @('-S', 'desktop-pdf', '-B', $build, '-G', $plan.CMakeGenerator,
                  '-A', $plan.CMakePlatform, '-T', 'v143', '-DCMAKE_SYSTEM_VERSION=10.0.26100.0',
                  "-DCMAKE_GENERATOR_INSTANCE=$($instances[0])")
              Checked cmake @('--build', $build, '--config', 'Release', '--parallel', '2')
              $pe = foreach ($name in @('IntegrationApp.exe', 'IntegrationTask.dll', 'IntegrationHost.exe',
                  'IntegrationClient.exe', 'IntegrationContract.exe', 'IntegrationNative.exe',
                  'IntegrationProcessTests.exe', 'IntegrationWorkerFixture.exe')) {
                  $file = Join-Path $build "Release/$name"
                  $bytes = [IO.File]::ReadAllBytes($file)
                  Assert-PrinterPeMachine -Bytes $bytes -Architecture $env:TARGET_ARCH -Name $name
                  [ordered]@{ file = $name; machine = ('0x{0:x4}' -f (Get-PrinterPeMachine $bytes))
                      sha256 = (Get-FileHash -LiteralPath $file -Algorithm SHA256).Hash.ToLowerInvariant() }
              }
              [IO.File]::WriteAllText("$env:EVIDENCE/pe-machines.json", ($pe | ConvertTo-Json -Depth 4))
              Checked ctest @('--test-dir', $build, '-C', 'Release', '--output-on-failure', '--verbose',
                  '--no-tests=error', '--timeout', '60')
              [ordered]@{ source_sha = $env:SOURCE_SHA; architecture = $env:TARGET_ARCH; ctests = 'passed'; pe = @($pe) } |
                  ConvertTo-Json -Depth 5 | Set-Content -LiteralPath (Join-Path $build 'own-build.json') -Encoding utf8
          } finally {
              $ctestLog = Join-Path $build 'Testing/Temporary/LastTest.log'
              if (Test-Path -LiteralPath $ctestLog -PathType Leaf) {
                  Copy-Item -LiteralPath $ctestLog -Destination "$env:EVIDENCE/native-ctest.txt"
              }
          }
      - name: Verify unsigned own-payload package after native tests
        id: package
        if: ${{ success() && steps.native.outcome == 'success' }}
        run: |
          $ErrorActionPreference = 'Stop'
          $out = Join-Path $PWD "desktop-pdf/out/ci-package-$env:TARGET_ARCH"
          $primary = $null
          try {
              & ./desktop-pdf/build.ps1 -Stage Package -Architecture $env:TARGET_ARCH `
                  -VisualStudioVersion $env:VISUAL_STUDIO -OutputRoot $out `
                  -BuildDirectory (Join-Path $PWD "desktop-pdf/out/ci-$env:TARGET_ARCH") `
                  -CMakePath (Get-Command cmake -CommandType Application).Source
          } catch { $primary = $_; throw } finally {
              if (Test-Path -LiteralPath "$out/package-evidence.json" -PathType Leaf) {
                  try { Copy-Item -LiteralPath "$out/package-evidence.json" -Destination "$env:EVIDENCE/package-evidence.json" }
                  catch { if ($primary) { Write-Error -ErrorAction Continue "Additional evidence-copy failure: $_" } else { throw } }
              }
          }
      - name: Record actual own-code gate outcomes, not product proof
        if: always()
        env:
          GUARD_OUTCOME: ${{ steps.guard.outcome }}
          SOURCE_OUTCOME: ${{ steps.source.outcome }}
          NATIVE_OUTCOME: ${{ steps.native.outcome }}
          PACKAGE_OUTCOME: ${{ steps.package.outcome }}
        run: |
          [IO.Directory]::CreateDirectory($env:EVIDENCE) | Out-Null
          $receipt = [ordered]@{
              schema = '4d-pdf-printer.own-code-ci'; version = 2
              source_sha = $env:SOURCE_SHA; expected_sha = $env:EXPECTED_SHA
              head_verified = ($env:GUARD_OUTCOME -eq 'success')
              scope = $env:SELECTED_SCOPE; architecture = $env:TARGET_ARCH
              os_architecture = [Runtime.InteropServices.RuntimeInformation]::OSArchitecture.ToString()
              requested_visual_studio = $env:VISUAL_STUDIO; requested_sdk = '10.0.26100.0'; requested_toolset = 'v143'
              guard = $env:GUARD_OUTCOME; source_checks = $env:SOURCE_OUTCOME; build_pe_ctests = $env:NATIVE_OUTCOME
              renderer_executed = $false; psa_activation_tested = $false
              controlled_process_publication_tests = ($env:NATIVE_OUTCOME -eq 'success')
              packaged_publication_tested = $false; productUsable = $false
              packaging_outcome = $env:PACKAGE_OUTCOME
              unsigned_package_verified = ($env:PACKAGE_OUTCOME -eq 'success')
          }
          [IO.File]::WriteAllText("$env:EVIDENCE/receipt.json", ($receipt | ConvertTo-Json))
      - name: Upload allowlisted own-code JSON and text only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-pdf-own-code-${{ matrix.arch }}-evidence
          path: |
            ${{ env.EVIDENCE }}/receipt.json
            ${{ env.EVIDENCE }}/pe-machines.json
            ${{ env.EVIDENCE }}/source-checks.txt
            ${{ env.EVIDENCE }}/build-and-tests.txt
            ${{ env.EVIDENCE }}/native-ctest.txt
            ${{ env.EVIDENCE }}/package-evidence.json
          if-no-files-found: warn
          retention-days: 14

  standalone:
    name: Renderer native ${{ matrix.arch }}
    needs: integration
    if: ${{ needs.integration.result == 'success' && (github.event_name != 'workflow_dispatch' || inputs.scope == 'full') }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
            visualStudio: '2022'
          - arch: arm64
            runner: windows-11-arm
            visualStudio: '2026'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      VCPKG_COMMIT: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_BINARY_SOURCES: clear
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - name: Verify identical source after whole own-code matrix succeeded
        run: |
          $head = & git rev-parse HEAD
          if ($LASTEXITCODE -ne 0 -or $head -cne $env:SOURCE_SHA) { throw 'Renderer checkout is not exact approved event head.' }
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64 # Interpreter may be emulated; target worker must be native.
      - name: Check portable Visual Studio selection
        run: |
          & renderer/tests/Check-BuildSupport.ps1
      - name: Prepare explicit native target toolchain
        run: |
          & renderer/tools/build-windows.ps1 -Architecture '${{ matrix.arch }}' -Stage Prepare `
            -VisualStudioVersion '${{ matrix.visualStudio }}'
      # Full scope only: local ephemeral caches, never public binary cache transfer.
      - name: Build dynamic dependencies and worker
        run: |
          & renderer/tools/build-windows.ps1 -Architecture '${{ matrix.arch }}' -Stage Build
      - name: Assemble fresh runtime, verify imports/notices and run renderer contract
        run: |
          & renderer/tools/build-windows.ps1 -Architecture '${{ matrix.arch }}' -Stage Test
      - name: Upload allowlisted renderer JSON and text only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-windows-${{ matrix.arch }}-evidence
          path: |
            renderer/build-evidence-${{ matrix.arch }}/runtime-imports.json
            renderer/build-evidence-${{ matrix.arch }}/build-provenance.json
            renderer/build-evidence-${{ matrix.arch }}/native-test-receipt.json
            renderer/build-evidence-${{ matrix.arch }}/test-results.txt
            renderer/build-evidence-${{ matrix.arch }}/notices/*/copyright
            renderer/build-evidence-${{ matrix.arch }}/notices/*/vcpkg.spdx.json
            renderer/build-windows-${{ matrix.arch }}/Testing/Temporary/LastTest.log
          if-no-files-found: warn
          retention-days: 14
