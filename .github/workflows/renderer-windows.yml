name: Renderer Windows

on:
  pull_request:
    paths: ['renderer/**', 'docs/renderer/**', '.github/workflows/renderer-windows.yml']
  push:
    branches: [main]
    paths: ['renderer/**', 'docs/renderer/**', '.github/workflows/renderer-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone:
    name: Native Windows ${{ matrix.arch }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x64
            runner: windows-2022
          - arch: arm64
            runner: windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 120
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_COMMIT: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
      VCPKG_DISABLE_METRICS: '1'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          architecture: x64 # Host interpreter may be emulated; target worker must be native.
      - name: Assert native OS and select pinned v143 toolchain
        id: prepare
        run: |
          & renderer/tools/build-windows.ps1 -Architecture '${{ matrix.arch }}' -Stage Prepare
      - name: Restore architecture/toolchain/recipe-specific vcpkg binary cache
        id: dependency-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: renderer/build-vcpkg-cache-${{ matrix.arch }}/
          # Exact keys only; vcpkg compiler/ABI tracking remains enabled too.
          key: renderer-vcpkg-v1-${{ matrix.arch }}-${{ env.VCPKG_COMMIT }}-${{ steps.prepare.outputs.toolchain }}-${{ hashFiles('renderer/vcpkg.json', 'renderer/ports/**', 'renderer/tools/build-windows.ps1') }}
      - name: Build dynamic target dependencies and worker
        run: |
          & renderer/tools/build-windows.ps1 -Architecture '${{ matrix.arch }}' -Stage Build
      - name: Save reusable dependencies before exercising the contract
        if: always() && steps.prepare.outcome == 'success' && steps.dependency-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: renderer/build-vcpkg-cache-${{ matrix.arch }}/
          key: ${{ steps.dependency-cache.outputs.cache-primary-key }}
      - name: Assemble local runtime, verify PE closure/notices, execute native contract
        run: |
          & renderer/tools/build-windows.ps1 -Architecture '${{ matrix.arch }}' -Stage Test
      # The executable/DLL runtime tree stays local; redistribution/source gates are not cleared.
      - name: Upload EVIDENCE ONLY (inventory, provenance, notices and test logs)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-windows-${{ matrix.arch }}-evidence
          path: |
            renderer/build-evidence-${{ matrix.arch }}/
            renderer/build-windows-${{ matrix.arch }}/Testing/Temporary/LastTest.log
            renderer/build-vcpkg-${{ matrix.arch }}/buildtrees/*/config-*-out.log
            renderer/build-vcpkg-${{ matrix.arch }}/buildtrees/*/install-*-out.log
          if-no-files-found: warn
          retention-days: 14
