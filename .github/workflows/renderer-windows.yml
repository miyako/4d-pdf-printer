name: Renderer Windows

on:
  pull_request:
    paths: ['renderer/**', 'docs/renderer/**', '.github/workflows/renderer-windows.yml']
  push:
    branches: [main]
    paths: ['renderer/**', 'docs/renderer/**', '.github/workflows/renderer-windows.yml']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  standalone-x64:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        shell: pwsh
    env:
      VCPKG_COMMIT: 866e9e258a76437074a5cf02d4c2d71b53bff2f8
      VCPKG_DEFAULT_TRIPLET: x64-windows
      VCPKG_DEFAULT_HOST_TRIPLET: x64-windows
      VCPKG_DISABLE_METRICS: '1'
      VCPKG_BINARY_SOURCES: clear
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Fetch pinned vcpkg
        run: |
          git init renderer/build-vcpkg
          git -C renderer/build-vcpkg remote add origin https://github.com/microsoft/vcpkg.git
          git -C renderer/build-vcpkg fetch --depth 1 origin $env:VCPKG_COMMIT
          git -C renderer/build-vcpkg checkout --detach FETCH_HEAD
          if ((git -C renderer/build-vcpkg rev-parse HEAD) -ne $env:VCPKG_COMMIT) { throw 'vcpkg pin mismatch' }
          & renderer/build-vcpkg/bootstrap-vcpkg.bat -disableMetrics
          if ($LASTEXITCODE) { throw 'vcpkg bootstrap failed' }
      - name: Resolve dynamic dependencies
        run: |
          & renderer/build-vcpkg/vcpkg.exe install --triplet x64-windows --host-triplet x64-windows --x-manifest-root=renderer --x-install-root=renderer/build-installed
          if ($LASTEXITCODE) { throw 'vcpkg dependency build failed' }
      - name: Configure and build worker
        run: |
          python -m pip install -r renderer/tests/requirements.txt
          if ($LASTEXITCODE) { throw 'Test dependency installation failed' }
          $root = (Get-Location).Path
          $env:PKG_CONFIG_PATH = "$root/renderer/build-installed/x64-windows/lib/pkgconfig;$root/renderer/build-installed/x64-windows/share/pkgconfig"
          cmake -S renderer -B renderer/build-windows -G "Visual Studio 17 2022" -A x64 `
            "-DCMAKE_TOOLCHAIN_FILE=$root/renderer/build-vcpkg/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$root/renderer/build-installed" `
            -DVCPKG_TARGET_TRIPLET=x64-windows -DVCPKG_HOST_TRIPLET=x64-windows `
            "-DPKG_CONFIG_EXECUTABLE=$root/renderer/build-installed/x64-windows/tools/pkgconf/pkgconf.exe" `
            "-DPython3_EXECUTABLE=$((Get-Command python).Source)"
          if ($LASTEXITCODE) { throw 'CMake configure failed' }
          cmake --build renderer/build-windows --config Release --parallel
          if ($LASTEXITCODE) { throw 'Worker build failed' }
      - name: Exercise standalone contract
        run: |
          ctest --test-dir renderer/build-windows -C Release --output-on-failure --verbose
          if ($LASTEXITCODE) { throw 'Worker tests failed' }
      - name: Inventory actual PE dependencies and installed notices
        run: |
          & renderer/tools/inventory-windows.ps1 `
            -InstalledRoot renderer/build-installed `
            -RuntimeRoot renderer/build-windows/Release `
            -OutputRoot renderer/build-evidence
          Copy-Item renderer/vcpkg.json renderer/build-evidence/manifest.json
          Copy-Item renderer/build-windows/Testing/Temporary/LastTest.log renderer/build-evidence/test-results.txt
          & renderer/build-vcpkg/vcpkg.exe version | Set-Content renderer/build-evidence/vcpkg-version.txt
          Get-FileHash renderer/ports/libgxps/*.patch -Algorithm SHA256 |
            Format-Table -AutoSize | Out-String | Set-Content renderer/build-evidence/patch-hashes.txt
      - name: Upload evidence only, not a redistributable runtime
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: renderer-windows-x64-evidence
          path: |
            renderer/build-evidence/
            renderer/build-windows/Testing/Temporary/LastTest.log
            renderer/build-vcpkg/buildtrees/*/config-*-out.log
            renderer/build-vcpkg/buildtrees/*/install-*-out.log
          if-no-files-found: warn
          retention-days: 14
